name: Extract ZIP to Repo Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Find Prime Hide ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.zip.outputs.ZIP_FILE }}"

          rm -rf _prime_extract
          mkdir -p _prime_extract

          unzip -q "$ZIP_FILE" -d _prime_extract

          echo "=== EXTRACTED FILES ==="
          find _prime_extract -maxdepth 3 -type f | sort

      - name: Detect project root
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "_prime_extract/package.json" ]; then
            PROJECT_ROOT="_prime_extract"
          else
            PACKAGE_JSON=$(find _prime_extract -mindepth 1 -maxdepth 3 -type f -name "package.json" | head -n 1)

            if [ -z "$PACKAGE_JSON" ]; then
              echo "ERROR: package.json not found."
              exit 1
            fi

            PROJECT_ROOT=$(dirname "$PACKAGE_JSON")
          fi

          echo "Project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Replace repository with React project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="${{ steps.project.outputs.PROJECT_ROOT }}"
          ZIP_FILE="${{ steps.zip.outputs.ZIP_FILE }}"

          echo "Cleaning old project..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "_prime_extract" \
            ! -name "$(basename "$ZIP_FILE")" \
            -exec rm -rf {} +

          echo "Copying Prime Hide project..."

          cp -a "$PROJECT_ROOT"/. .

          rm -rf _prime_extract
          rm -f "$ZIP_FILE"

      - name: Create gitignore
        shell: bash
        run: |
          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          .DS_Store
          *.log
          EOF

      - name: Verify React project
        shell: bash
        run: |
          set -e

          echo "=== ROOT ==="
          ls -la

          echo ""
          echo "=== VERIFYING PROJECT ==="

          test -f package.json
          test -f index.html
          test -f vite.config.js
          test -d src
          test -f src/main.jsx
          test -f src/styles.css

          echo "package.json ........ OK"
          echo "index.html .......... OK"
          echo "vite.config.js ...... OK"
          echo "src/ ................ OK"
          echo "src/main.jsx ........ OK"
          echo "src/styles.css ...... OK"

          echo ""
          echo "=== PUBLIC ASSETS ==="
          find public -maxdepth 3 -type f | sort

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          npm install

      - name: Build React project
        shell: bash
        run: |
          set -e
          npm run build

      - name: Remove generated files
        shell: bash
        run: |
          rm -rf node_modules
          rm -rf dist

      - name: Commit website only
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== STAGING WEBSITE ==="

          git add -A

          # Never try to modify the workflow that is currently running.
          git reset -- .github/workflows/extract-zip.yml || true

          echo ""
          echo "=== STAGED FILES ==="
          git diff --cached --name-only

          if git diff --cached --quiet; then
            echo "No website changes to commit."
            exit 0
          fi

          git commit -m "Deploy Prime Hide React website"

          echo ""
          echo "Pushing website..."

          git push origin HEAD:main
