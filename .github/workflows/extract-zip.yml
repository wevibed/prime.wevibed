name: Extract ZIP to Repo Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP found in repository root."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.zip.outputs.ZIP_FILE }}"

          rm -rf _extracted
          mkdir -p _extracted

          unzip -q "$ZIP_FILE" -d _extracted

          ROOTS=$(find _extracted -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find _extracted -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$ROOTS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            PROJECT_DIR=$(find _extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="_extracted"
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "_extracted" \
            ! -name "$(basename "$ZIP_FILE")" \
            -exec rm -rf {} +

          cp -a "$PROJECT_DIR"/. .

          rm -rf _extracted
          rm -f "$ZIP_FILE"

      - name: Show final structure
        shell: bash
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== SRC ==="
          find src -maxdepth 2 -type f | sort

          echo "=== PUBLIC ==="
          find public -maxdepth 2 -type f | sort

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Replace repo with Prime Hide React app"
          git push
