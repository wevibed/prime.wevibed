name: Extract ZIP to Repo Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Prime Hide ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.zip.outputs.ZIP_FILE }}"

          rm -rf _prime_extract
          mkdir -p _prime_extract

          echo "Extracting: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d _prime_extract

          echo "=== EXTRACTED CONTENT ==="
          find _prime_extract -maxdepth 3 -type f | sort

      - name: Detect project root
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=""

          if [ -f "_prime_extract/package.json" ]; then
            PROJECT_ROOT="_prime_extract"
          else
            FOUND=$(find _prime_extract -mindepth 1 -maxdepth 2 -type f -name "package.json" -print -quit)

            if [ -n "$FOUND" ]; then
              PROJECT_ROOT=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          echo "Project root detected: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Replace repository with React project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="${{ steps.project.outputs.PROJECT_ROOT }}"
          ZIP_FILE="${{ steps.zip.outputs.ZIP_FILE }}"

          echo "Replacing repository contents..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "_prime_extract" \
            ! -name "$(basename "$ZIP_FILE")" \
            -exec rm -rf {} +

          cp -a "$PROJECT_ROOT"/. .

          rm -rf _prime_extract
          rm -f "$ZIP_FILE"

      - name: Verify React project
        shell: bash
        run: |
          set -e

          echo "=== ROOT ==="
          ls -la

          echo ""
          echo "=== REQUIRED FILES ==="

          test -f package.json
          test -f index.html
          test -f vite.config.js
          test -d src

          echo "package.json ✓"
          echo "index.html ✓"
          echo "vite.config.js ✓"
          echo "src/ ✓"

          echo ""
          echo "=== SRC ==="
          find src -maxdepth 3 -type f | sort

          echo ""
          echo "=== PUBLIC ==="
          find public -maxdepth 3 -type f | sort

      - name: Install dependencies
        shell: bash
        run: |
          npm install

      - name: Build React project
        shell: bash
        run: |
          npm run build

      - name: Commit project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Replace repo with Prime Hide React app"
          git push
